[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aigent-connector"
version = "0.7.0"
description = "Self-hosted Telegram IDE agent with DeepSeek, topic sessions, media bridge and transparent cache accounting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "eschota"}]
keywords = ["deepseek", "telegram", "ai-agent", "ide", "context-caching", "self-hosted"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "Pillow>=11.2,<13", "pywin32>=308; sys_platform == 'win32'",
                "deepseek-harness-sdk==0.1.5rc1"]  # the engine; pinned because the harness is a preview with breaking changes

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
desktop = ["claude-agent-sdk==0.2.152", "pyinstaller>=6,<7"]
assets = ["trimesh>=4,<5", "numpy>=2,<3"]

[project.urls]
Homepage = "https://github.com/eschota/AIGent"
Issues = "https://github.com/eschota/AIGent/issues"

[tool.setuptools.package-data]
connector = ["static/*", "resources/*.py"]

[tool.setuptools.packages.find]
include = ["connector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.local/pytest"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
